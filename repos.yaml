# repos.yaml v0.5 - see repos.chat
repo: repos.chat
is: Repository Representation Protocol for verified, proactive Repo Reps and durable local conversations.
url: https://repos.chat
cluster: agent-infrastructure

provides:
  - id: local-codex-session-bridge
    what: continues explicitly bound Codex sessions through a local app-server connection with native writer ownership and verified request receipts
    at: local-bridge.mjs
  - id: private-conversation-queue
    what: local decision cards and durable approved requests for an active Codex desktop task relay
    at: queue.mjs
  - id: manifest-verifier
    what: verifies that repository capability claims point to real paths
    at: repos.mjs
  - id: repository-graph
    what: resolves repository identities, capabilities, and kin edges as JSON
    at: repos.mjs
  - id: agent-mailbox
    what: sends, reads, and acknowledges durable local messages between repository agents
    at: repos.mjs
  - id: agent-protocol
    what: defines Repo Rep identity, presence, messages, execution, evidence, and safety boundaries
    at: AGENT_PROTOCOL.md
  - id: agent-host
    what: runs or proactively watches locked inbox requests inside the recipient repository on codex, claude, or grok, with conversation history for follow-ups
    at: agent-host.mjs
  - id: model-host-adapters
    what: one schema-constrained headless invocation per model CLI (codex, claude, grok) sharing a single completion contract mapped to A2A task states
    at: hosts.mjs
  - id: mcp-server
    what: stdio MCP server giving any live agent session discovery, proposals, notices, inbox, conversations, and sent-message delivery status under a launch-fixed identity, with no approval tool
    at: mcp.mjs
  - id: session-delivery-hook
    what: Claude Code UserPromptSubmit and SessionStart hook that injects each new message once per session as untrusted relayed content, never blocks a prompt, and records a seen receipt
    at: inbox-hook.mjs
  - id: delivery-receipts
    what: queued, seen, and acked delivery states with append-only per-session receipts, expiry, and stale-message detection
    at: receipts.mjs
  - id: cross-model-bridges
    what: compares MCP Agent Mail, ACP, PAL clink, and Codex-as-MCP wrappers with repos.chat's cross-model design
    at: BRIDGES.md
  - id: local-protocol-inspector
    what: visualizes the full repository graph as original pixel Repo Pets with live presence, executable recipes, proposals, protocol envelopes, Git commits, and draft PRs on localhost
    at: dashboard.mjs
  - id: exchange-proposals
    what: verifies versioned exchange recipes and converts manual, webhook, CI, or contract-drift signals into human-approved durable requests
    at: repos.mjs
  - id: guarded-github-app
    what: plans hash-locked changes and, only after exact confirmation, creates an app-authored commit and draft pull request with minimal GitHub App permissions
    at: github-app.mjs
  - id: protocol-prior-art
    what: compares repos.chat with A2A, MCP, FIPA ACL, ACP, ANP, AGNTCY, and multi-agent frameworks
    at: PROTOCOL_RESEARCH.md
  - id: repository-owner-skill
    what: installable skill for assigning, verifying, and coordinating bounded Repo Reps
    at: skills/repos-chat/SKILL.md
  - id: github-star-match-skill
    what: installable skill for evaluating external GitHub mechanisms against real local code before adoption
    at: skills/github-star-match/SKILL.md

stack: [node, vercel]

kin: []

canon: AGENT_PROTOCOL.md
