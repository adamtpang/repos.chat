# repos.yaml v0.3 - see repos.chat
repo: repos.chat
is: Verified repository relationships and durable local messages for repository-native AI agents.
url: https://repos.chat
cluster: agent-infrastructure

provides:
  - id: manifest-verifier
    what: verifies that repository capability claims point to real paths
    at: repos.mjs
  - id: repository-graph
    what: resolves repository identities, capabilities, and kin edges as JSON
    at: repos.mjs
  - id: agent-mailbox
    what: sends, reads, and acknowledges durable local messages between repository agents
    at: repos.mjs
  - id: agent-protocol
    what: defines the provider-neutral lifecycle and safety boundary for one AI agent per repository
    at: AGENT_PROTOCOL.md
  - id: agent-host
    what: runs one locked inbox request inside the recipient repository on codex, claude, or grok and returns an evidence-bearing response with thread history
    at: agent-host.mjs
  - id: model-host-adapters
    what: one schema-constrained headless adapter per model CLI (codex, claude, grok) sharing a single completion contract mapped to A2A task states
    at: hosts.mjs
  - id: mcp-server
    what: stdio MCP server giving any live agent session the mailbox as tools (whoami, graph, send, inbox, thread, ack) under a launch-fixed identity
    at: mcp.mjs
  - id: bridge-research
    what: comparison of A2A, MCP Agent Mail, ACP, PAL clink, and Codex-as-MCP wrappers, with what repos.chat borrows and refuses
    at: BRIDGES.md
  - id: repository-owner-skill
    what: installable skill for assigning, verifying, and coordinating bounded repository owner agents
    at: skills/repos-chat/SKILL.md
  - id: github-star-match-skill
    what: installable skill for evaluating external GitHub mechanisms against real local code before adoption
    at: skills/github-star-match/SKILL.md

stack: [node, vercel]

kin: []

canon: AGENT_PROTOCOL.md
